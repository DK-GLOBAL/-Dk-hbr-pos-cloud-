<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>DK HBR POS</title><meta name="theme-color" content="#b08d57"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png">

<style>

*{box-sizing:border-box}body{margin:0;font:15px/1.6 Inter,system-ui,sans-serif;color:var(--ink);background:var(--cream)}

.hero h1{font-size:clamp(36px,7vw,68px);line-height:1.1;margin:10px 0 14px}.hero p{max-width:520px;color:#d9d4c9;font-size:17px}

.sec{padding:64px 0}.sec h2{font-size:clamp(26px,4vw,38px);margin-bottom:6px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:24px}

</style></head><body>

<div class="nav"><div class="wrap"><div class="logo" id="lg1"></div><div><button class="btn o" data-a="lgo" style="margin-right:8px">Sign in</button><a href="#book" id="nb" class="btn" style="text-decoration:none;display:inline-block">Book now</a></div></div></div>

<script>
const QH=new URLSearchParams(location.search).get("h")||"";const HOTEL={name:QH?"":"DK HBR POS",tag:QH?"":"The hotel, bar and restaurant system. Online booking, POS, inventory and printable receipts for every outlet.",phone:"",addr:QH?"":"By DK Global Tech"};
const SV=[["Rooms and suites","Comfortable rooms, made up and ready for your arrival."],["Restaurant table","Reserve a table and tell us what to prepare."],["Bar and lounge","Evening drinks and a corner kept just for you."],["Spa and wellness","Massage and treatments, booked to your time."],["Events and conferences","Meetings, weddings and celebrations, set up in advance."],["Airport or town transfer","A driver waiting with your name on it."]];
const FT=[["Online guest booking","Guests book rooms, tables and treatments online, with their phone number saved."],["Bar, restaurant and spa POS","Fast bills with M-Pesa, card, cash and room charge."],["Inventory that updates itself","Every sale deducts stock, with low-stock alerts for seniors."],["Roles, audit trail and stock","Owner, director, manager, supervisor, cashier, reception and waiter. Managers control their staff and see every action in the audit trail."],["Works offline, installs on any device","Install on phone, tablet or computer. Keep selling without internet; bills sync when you are back online."],["Printable receipts","The guest’s phone number prints on every receipt."],["Your own booking page","Each hotel gets its own link to share with guests."]];
const $=id=>document.getElementById(id),esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>"KSh "+Math.round(n).toLocaleString(),SEN=["owner","director","manager","supervisor"],STFR=["owner","director","manager"],RK=["waiter","reception","cashier","supervisor","manager","director","owner"],ld=d=>new Date(d).toLocaleDateString([],{weekday:"short",day:"numeric",month:"short"});
const lymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
let S={t:localStorage.getItem("dkt")||"",me:null,menu:[],orders:[],bookings:[],stock:[],staff:[]},tab="pos",per=1,bf="up",cart={lines:{},ref:"",name:"",phone:"",id:null,bk:null,dept:"Restaurant"},poll;
function paintLand(){
 const P=!QH;document.title=HOTEL.name||"DK HBR POS";
 $("lg1").innerHTML=esc(HOTEL.name).replace(/^(\S+)/,"<b>$1</b>");$("hn").textContent=HOTEL.name;$("tg").textContent=HOTEL.tag;$("ad").textContent=HOTEL.addr;$("fn").textContent=HOTEL.name;$("fa").textContent=[HOTEL.addr,HOTEL.phone].filter(Boolean).join(" · ");
 $("cards").innerHTML=(P?FT:SV).map((x,i)=>`<div class="sv"><i>✦</i><h3>${x[0]}</h3><p class="mut" style="font-size:14px">${x[1]}</p>${P?"":`<button class="btn o" data-a="pick" data-v="${i}">Book this</button>`}</div>`).join("");
 $("se").textContent=P?"Built for hotels, bars and restaurants":"Stay · Dine · Unwind";$("sh").textContent=P?"Run every outlet from one screen":"Everything you need, under one roof";
 $("nb").textContent=P?"Request account":"Book now";$("hb").textContent=P?"Request your account":"Plan your visit";
 $("be1").textContent=P?"Get started":"Book online";$("bh").textContent=P?"Create your hotel account":"Tell us what you need. We’ll have it ready.";
 $("bf").style.display=P?"none":"";$("sg").style.display=P?"":"none";$("li").value=QH;lin()}
$("sv").innerHTML=SV.map(x=>`<option>${x[0]}</option>`).join("");$("dt").min=lymd(new Date());$("dt").value=lymd(new Date(Date.now()+864e5));paintLand();
if(QH)api("pub",{h:QH}).then(r=>{Object.assign(HOTEL,r);paintLand()}).catch(x=>{HOTEL.name="Hotel not found";HOTEL.tag=x.message;paintLand()});
function toast(m){const t=$("toast");t.textContent=m;t.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display="none",3000)}
async function api(a,d){let r;try{r=await fetch("/api/s",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(Object.assign({a,t:S.t},d||{}))})}catch(e){throw Object.assign(new Error("No internet connection. This needs a connection."),{net:1})}const j=await r.json().catch(()=>({err:"Network problem"}));if(!r.ok){if((r.status===401||r.status===403)&&S.me){out();toast(j.err)}throw new Error(j.err||"Something went wrong")}return j}
$("bf").onsubmit=async e=>{e.preventDefault();$("be").textContent="";try{const f=Object.fromEntries(new FormData(e.target)),r=await api("book",Object.assign({h:QH},f));$("bo").innerHTML=`<div class="ok"><b>Request received. Reference ${esc(r.ref)}.</b><br>We’ll call or WhatsApp you on ${esc(f.phone)} to confirm. This number will appear on your receipt.</div>`;e.target.reset();$("dt").value=lymd(new Date(Date.now()+864e5))}catch(x){$("be").textContent=x.message}};
$("sg").onsubmit=async e=>{e.preventDefault();$("sge").textContent="";try{await api("signup",Object.fromEntries(new FormData(e.target)));$("sgo").innerHTML='<div class="ok"><b>Request received.</b><br>We’ll review it and approve your account. Then sign in with your email and password.</div>';e.target.reset()}catch(x){$("sge").textContent=x.message}};
const can={pay:()=>S.me.role!=="waiter",sen:()=>SEN.includes(S.me.role),stf:()=>STFR.includes(S.me.role),top:()=>["owner","director"].includes(S.me.role)};
const pend=()=>(S.reqs||[]).filter(x=>x.status==="pending");
const TABS=()=>S.me.role==="platform"?[["req","Requests"+(pend().length?" ("+pend().length+")":"")],["cl","Clients"],["nc","Create client"],["ps","Payment details"],["pau","Audit trail"],["pst","Settings"]]:[["pos","New bill"],["bills","Bills"],["bookings","Bookings"],...(can.sen()?[["inventory","Stock"],["menu","Menu"],["reports","Reports"]]:[]),...(can.stf()?[["staff","Staff"],["audit","Audit trail"],["set","Settings"]]:[])];
function enter(r){S.t=r.t;localStorage.setItem("dkt",r.t);S.me=r.me;tab=r.me.role==="platform"?"req":"pos";$("lg").style.display="none";$("land").style.display="none";$("app").style.display="block";shell();sync();clearInterval(poll);poll=setInterval(()=>{if(!document.hidden)sync()},12000)}

async function sync0(){try{Object.assign(S,await api("sync"));if(S.me.role!=="platform"){refreshLocal();cache();S.off=0}bar();if(S.cfg)Object.assign(HOTEL,S.cfg);if(!$("v"))return;const rb=document.querySelector("#app [data-v=req]");if(rb)rb.textContent="Requests"+(pend().length?" ("+pend().length+")":"");if(tab==="menu"||tab==="inventory"||tab==="staff"){const l=$("ls");if(l)({menu:lMenu,inventory:lInv,staff:lStaff})[tab]()}else if(!["pos","nc","set","ps","pst","audit"].includes(tab)){const f=document.activeElement;if(f&&f.closest&&f.closest("#v")&&/INPUT|TEXTAREA|SELECT/.test(f.tagName))return;keepView()}}catch(e){if(e.net)bar()}}
const qget=()=>{try{return JSON.parse(localStorage.getItem("dkq")||"[]")}catch(e){return[]}},qset=a=>localStorage.setItem("dkq",JSON.stringify(a)),qmine=()=>qget().filter(x=>x.slug===S.slug);
const newId=()=>Array.from(crypto.getRandomValues(new Uint8Array(8)),b=>b.toString(16).padStart(2,"0")).join("");
function qOrders(){return qmine().map(q=>({id:q.cid,no:"OFF"+q.n,ts:q.off,by:S.me.name,status:q.pay?"paid":"open",lines:q.lines,total:q.lines.reduce((a,l)=>a+l.p*l.q,0),name:q.name,phone:q.phone,ref:q.ref,pay:q.pay,paidTs:q.pay?q.off:0,cashier:q.pay?S.me.name:undefined,local:1,err:q.err}))}

function bar(){const e=$("net");if(!e)return;const q=S.me&&S.me.role!=="platform"?qmine():[],n=q.length,bd=q.filter(x=>x.err).length;let m="";if(!navigator.onLine)m="Offline. You can keep selling. "+(n?n+" bill(s) waiting to sync.":"Everything syncs when you are back online.");else if(bd)m=bd+" bill(s) could not sync. Tap to review.";else if(n)m="Syncing "+n+" bill(s)...";e.style.display=m?"block":"none";e.textContent=m;e.setAttribute("data-a",bd?"qerr":"x")}

 cart={lines:{},ref:"",name:"",phone:"",id:null,bk:null,dept:cart.dept};if(!off)await sync();else bar();

 const st=per===0?0:new Date().setHours(0,0,0,0)-(per-1)*864e5,p=S.orders.filter(o=>o.status==="paid"&&o.paidTs>=st),s=p.reduce((a,o)=>a+o.total,0);
 const g=f=>{const m={};p.forEach(o=>f(o).forEach(([k,v])=>m[k]=(m[k]||0)+v));return Object.entries(m).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="row"><span>${esc(k)}</span><b>${money(v)}</b></div>`).join("")||'<p class="mut">No sales yet.</p>'};
 $("v").innerHTML=`<div class="chips">${[[1,"Today"],[7,"7 days"],[0,"All recent"]].map(([v,n])=>`<button class="chip ${v===per?"on":""}" data-a="per" data-v="${v}">${n}</button>`).join("")}</div><div class="mets"><div class="met"><span class="mut">Sales</span><b>${money(s)}</b></div><div class="met"><span class="mut">Paid bills</span><b>${p.length}</b></div><div class="met"><span class="mut">VAT included</span><b>${money(s*16/116)}</b></div><div class="met"><span class="mut">Low stock items</span><b>${S.stock.filter(x=>x.qty<=x.min).length}</b></div></div>
 <div class="mets" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))"><div class="card"><b>By payment</b>${g(o=>[[o.pay==="Room"?"Room charge":o.pay,o.total]])}</div><div class="card"><b>By section</b>${g(o=>o.lines.map(l=>[l.d||"Other",l.p*l.q]))}</div><div class="card"><b>By cashier</b>${g(o=>[[o.cashier||"-",o.total]])}</div></div>`}
function showRc(o){
 const v=o.total*16/116;
 $("rcpt").innerHTML=`<div><div class="paper"><div class="ctr"><b style="font-size:16px">${esc(HOTEL.name)}</b><br>${esc(HOTEL.addr)}<br>Tel ${esc(HOTEL.phone)}</div><hr><div>Receipt #${o.no}${o.local?" (saved offline)":""}<br>${new Date(o.paidTs||o.ts).toLocaleString()}</div>${o.name?`<div>Guest: ${esc(o.name)}</div>`:""}<div><b>Guest phone: ${esc(o.phone||"-")}</b></div>${o.ref?`<div>Ref: ${esc(o.ref)}</div>`:""}<hr>
 ${o.lines.map(l=>`<div class="r"><span>${l.q} x ${esc(l.n)}</span><span>${Math.round(l.p*l.q).toLocaleString()}</span></div>`).join("")}<hr><div class="r"><span>VAT 16% incl.</span><span>${Math.round(v).toLocaleString()}</span></div><div class="r"><b>TOTAL KSh</b><b>${Math.round(o.total).toLocaleString()}</b></div><div>Paid by: ${o.pay==="Room"?"Room charge":esc(o.pay||"-")}</div><div>Served by: ${esc(o.cashier||o.by)}</div><hr><div class="ctr">Thank you for staying with us</div>
 <div class="noprint" style="margin-top:10px;display:flex;gap:8px"><button class="go" style="margin:0" onclick="window.print()">Print</button><button class="sm" onclick="$('rcpt').style.display='none'">Close</button></div></div></div>`;$("rcpt").style.display="flex"}
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.closest("#lg")&&e.target.tagName==="INPUT"){const b=document.querySelector("#lg [data-a=login]"),c=$("sf").style.display==="block"?document.querySelector("#lg [data-a=setup]"):b;c&&c.click()}});
document.addEventListener("input",e=>{const i=e.target.id;if(i==="li")lin();if(i==="gn")cart.name=e.target.value;if(i==="gp")cart.phone=e.target.value;if(i==="gr")cart.ref=e.target.value});
document.addEventListener("change",async e=>{const r=e.target.closest("[data-a=srole]");if(r)try{await api("upd",{c:"staff",id:r.dataset.v,patch:{role:r.value}});toast("Role changed");sync()}catch(x){toast(x.message);sync()}const s=e.target.closest("[data-a=bst]");if(s)try{await api("upd",{c:"bookings",id:s.dataset.v,patch:{status:s.value}});sync()}catch(x){toast(x.message)}});
document.addEventListener("click",async e=>{
 const b=e.target.closest("[data-a]");if(!b||b.tagName==="SELECT")return;const a=b.dataset.a,v=b.dataset.v,g=i=>$(i).value.trim();
 try{
 if(a==="pick"){$("sv").selectedIndex=+v;$("book").scrollIntoView({behavior:"smooth"})}
 else if(a==="lgo"){$("lg").style.display="flex";$("le").textContent="";const rm=localStorage.getItem("dkr")||"";if(rm&&!$("li").value){$("li").value=rm;$("lr").checked=true}const r=await api("status");lmode(r.setup?"setup":"in");lin()}
  else if(a==="lgx")$("lg").style.display="none";
 else if(a==="login"){const v=g("li"),pw=$("lp").value;if(!v||!pw)throw new Error("Enter your details to sign in.");const lr=await api("login",v.includes("@")?{email:v,pw}:{h:v,name:g("ln"),pin:pw});if($("lr").checked)localStorage.setItem("dkr",v);else localStorage.removeItem("dkr");enter(lr);$("lp").value=""}
 else if(a==="setup"){enter(await api("setup",{code:g("sc"),name:g("sn"),email:g("se1"),pw:$("sw").value}))}
 else if(a==="app"){const r=await api("p_approve",Object.assign({id:v},pkgRead("r"+v)));toast("Client approved. Share the details with them.");await sync();S.share=r.id;S.edit=null;tab="cl";view()}
 else if(a==="rej"){if(confirm("Reject this request?")){await api("p_reject",{id:v});await sync()}}
 else if(a==="tst"){const t=S.tenants.find(x=>x.id===v);await api("p_status",{id:v,status:t.status==="active"?"suspended":"active"});await sync()}
 else if(a==="trs"){const pw=prompt("New temporary password for the owner (8+ characters)");if(pw){await api("p_reset",{id:v,pw});toast("Password reset")}}
 else if(a==="ncr"){const r=await api("p_create",Object.assign({name:g("cn"),owner:g("co"),email:g("ce"),phone:g("cp"),loc:g("cl1"),pw:g("cw")},pkgRead("c")));toast("Created. Hotel code: "+r.slug);await sync();S.share=r.id;S.edit=null;tab="cl";view()}
 else if(a==="cfg"){await api("cfg",{name:g("hn1"),phone:g("hp"),addr:g("ha"),tag:g("ht")});toast("Saved");await sync()}
 else if(a==="share"){S.share=v;S.edit=null;vCl()}
 else if(a==="shx"){S.share=null;vCl()}
 else if(a==="pedit"){S.edit=v;S.share=null;vCl()}
 else if(a==="pex"){S.edit=null;vCl()}
 else if(a==="psave"){await api("p_plan",Object.assign({id:v,paidUntil:g("ep"+v)},pkgRead("e"+v)));S.edit=null;toast("Package saved");await sync();vCl()}
 else if(a==="ppaid"){await api("p_paid",{id:v});toast("Marked as paid");await sync();vCl()}
 else if(a==="wa"){const t=S.tenants.find(x=>x.id===v);let n=String(t.phone).replace(/\D/g,"");if(n.startsWith("0"))n="254"+n.slice(1);else if(n.length===9)n="254"+n;window.open("https://wa.me/"+n+"?text="+encodeURIComponent($("shm").value),"_blank")}
 else if(a==="mail"){const t=S.tenants.find(x=>x.id===v);location.href="mailto:"+t.email+"?subject="+encodeURIComponent("Your DK HBR POS account")+"&body="+encodeURIComponent($("shm").value)}
 else if(a==="cpy"){try{await navigator.clipboard.writeText($("shm").value)}catch(e){$("shm").select();document.execCommand("copy")}toast("Copied")}
 else if(a==="pset"){await api("p_settings",{pay:g("psy"),contact:g("psc"),site:g("pss")});toast("Saved");await sync()}
 else if(a==="eye"){const p=$("lp");p.type=p.type==="password"?"text":"password"}
 else if(a==="forgot"){$("le").textContent="Hotel owners: contact DK Global Tech to reset your password. Staff: ask your manager to reset your PIN."}
 else if(a==="pafl"){paf=v;vPAud()}
 else if(a==="paexp"){const q=x=>'"'+String(x==null?"":x).replace(/"/g,'""')+'"',csv=["When,Who,Action,Details"].concat((S.audit||[]).map(x=>[new Date(x.ts).toISOString(),x.who,x.act,x.d].map(q).join(","))).join("\n"),l=document.createElement("a");l.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));l.download="platform-audit-trail.csv";l.click()}
 else if(a==="pdef"){const feat={};MODS.forEach(([k])=>feat[k]=$("pf_"+k).checked);await api("p_defaults",{vat:g("pv"),depts:g("pd"),feat});toast("Defaults saved");await sync();vPSet()}
 else if(a==="ptf"){const feat={};MODS.forEach(([k])=>feat[k]=$("tf"+v+"_"+k).value);await api("p_tfeat",{id:v,feat});toast("Client features saved");await sync();vPSet()}
 else if(a==="ppw"){if($("pnw").value!==$("pn2").value)throw new Error("The new passwords do not match.");const r=await api("p_pw",{cur:$("pcur").value,pw:$("pnw").value});if(r.t){S.t=r.t;localStorage.setItem("dkt",r.t)}["pcur","pnw","pn2"].forEach(i=>$(i).value="");toast("Password changed. Other devices were signed out.");await sync()}
 else if(a==="pso"){if(confirm("Sign out of every device, including this one?")){await api("signout_all");out()}}
 else if(a==="out")out();
 else if(a==="inst"){if(inst){inst.prompt();inst=null}else toast("Android: browser menu, Install app. iPhone: Share, Add to Home Screen.")}
 else if(a==="qerr"){const q=qmine().filter(x=>x.err);if(confirm(q.map(x=>"• "+x.err).join("\n")+"\n\nDiscard these bills? Press Cancel to keep them and fix the cause (for example an item removed from the menu).")){qset(qget().filter(x=>!(x.slug===S.slug&&x.err)));refreshLocal();bar();view()}}
 else if(a==="afl"){af=v;vAud()}
 else if(a==="spin"){const pw=prompt("New PIN for this person (4 to 8 digits)");if(pw){await api("upd",{c:"staff",id:v,patch:{pin:pw}});toast("PIN changed")}}
 else if(a==="tab"){tab=v;view()}
 else if(a==="dept"){cart.dept=v;vPos()}
 else if(a==="add"){const m=S.menu.find(x=>x.id===v);if(m){const l=cart.lines[v]||(cart.lines[v]={id:v,n:m.name,p:m.price,q:0,d:m.dept,sku:m.sku||""});l.q++;vPos()}}
 else if(a==="qty"){const[i,d]=v.split(":"),l=cart.lines[i];if(l){l.q+=+d;if(l.q<1)delete cart.lines[i];vPos()}}
 else if(a==="clr"){cart={lines:{},ref:"",name:"",phone:"",id:null,bk:null,dept:cart.dept};vPos()}
 else if(a==="save")await save();
 else if(a==="pay")await save(v);
 else if(a==="open"){const o=S.orders.find(x=>x.id===v);if(o){cart={lines:Object.fromEntries(o.lines.map(l=>[l.id,Object.assign({},l)])),ref:o.ref,name:o.name,phone:o.phone,id:o.id,bk:null,dept:cart.dept};tab="pos";view()}}
 else if(a==="void"){if(confirm("Void this bill and return its stock?")){await api("void",{id:v});toast("Bill voided");sync()}}
 else if(a==="rc"){const o=S.orders.find(x=>x.id===v);if(o)showRc(o)}
 else if(a==="bf"){bf=v;vBook()}
 else if(a==="bk"){const x=S.bookings.find(q=>q.id===v);if(x){cart={lines:{},ref:x.service+" "+x.ref,name:x.name,phone:x.phone,id:null,bk:x.id,dept:"Restaurant"};tab="pos";view()}}
 else if(a==="per"){per=+v;vRep()}
 else if(a==="stadd"){if(!g("in"))return toast("Enter an item name");await api("add",{c:"stock",item:{name:g("in"),qty:+g("iq")||0,unit:g("iu")||"unit",min:+g("im")||0}});["in","iq","iu","im"].forEach(i=>$(i).value="");await sync();lInv()}
 else if(a==="stadj"){const d=+g("d"+v);if(!d)return toast("Enter a number, like 24 or -3");await api("upd",{c:"stock",id:v,patch:{delta:d,why:g("w"+v)}});await sync();lInv()}
 else if(a==="stdel"){if(confirm("Delete this stock item?")){await api("del",{c:"stock",id:v});await sync();lInv()}}
 else if(a==="mnadd"){const p=+g("mp");if(!g("mn")||!(p>0))return toast("Enter a name and a price");await api("add",{c:"menu",item:{name:g("mn"),price:p,dept:$("md").value,sku:$("ms").value}});["mn","mp"].forEach(i=>$(i).value="");await sync();lMenu()}
 else if(a==="mndel"){await api("del",{c:"menu",id:v});await sync();lMenu()}
 else if(a==="stfadd"){await api("add",{c:"staff",item:{name:g("tn"),pin:g("tp"),role:$("tr").value}});["tn","tp"].forEach(i=>$(i).value="");toast("Staff added");await sync();lStaff()}
 else if(a==="stfdel"){if(confirm("Remove this person?")){await api("del",{c:"staff",id:v});await sync();lStaff()}}
 }catch(x){(a==="login"||a==="setup")?$("le").textContent=x.message:toast(x.message)}
});
if(S.t){let cc=null;try{cc=JSON.parse(localStorage.getItem("dkc")||"null")}catch(e){}
 if(cc&&cc.me){Object.assign(S,cc);if(S.cfg)Object.assign(HOTEL,S.cfg);refreshLocal();enter({t:S.t,me:cc.me});bar()}
 else api("sync").then(r=>{S.me=r.me;enter({t:S.t,me:r.me})}).catch(()=>{})}
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
